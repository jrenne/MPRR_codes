bookdown::gitbook:
  code_folding: hide
  css: style.css
  config:
    toc:
      before: |
        <li><a href="./">Asset Pricing with Discrete-Time Affine Processes</a></li>
      after: |
        <li><a href="https://github.com/jrenne/MPRR_codes" target="_blank">Source code on GitHub</a></li>
    sharing:
      facebook: no
      twitter: no
      all: []
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default
